<body class="bg-background text-on-background font-body-md h-screen w-full flex flex-col items-center justify-center overflow-hidden">
<!-- Mobile Container mimicking a phone screen -->
<div class="relative w-full max-w-md h-full max-h-[850px] bg-surface-bright sm:rounded-[40px] sm:shadow-2xl flex flex-col overflow-hidden sm:border-[8px] border-surface-container-highest">
<!-- Header / Back Button Area -->
<header class="flex items-center justify-between px-container-padding py-md w-full z-10 absolute top-0 left-0">
<button aria-label="Go back" class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="text-label-lg font-label-lg text-on-surface-variant">Your name</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-padding pt-24 pb-8 z-10 relative">
<div class="mb-8">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface mb-xs">What should we call you?</h1>
<p class="text-body-md font-body-md text-on-surface-variant">This helps us personalise your learning.</p>
</div>
<!-- Input Field -->
<div class="mb-stack-gap">
<label class="block text-label-lg font-label-lg text-on-surface-variant mb-xs" for="learner-name">Your name</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface text-body-lg font-body-lg rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent shadow-sm transition-all" id="learner-name" placeholder="Enter your name" type="text" value="Amina"/>
</div>
</div>
<!-- Device Saving Note -->
<div class="flex items-center justify-center text-on-surface-variant text-label-lg font-label-lg mt-sm mb-auto">
<span class="material-symbols-outlined text-[18px] mr-2">lock</span>
                Saved on this device
            </div>
<!-- Bottom Illustration and Button Area -->
<div class="mt-auto relative w-full h-64 flex flex-col justify-end">
<!-- Background Illustration Placeholder -->
<div class="absolute inset-0 z-0 pointer-events-none w-full h-full">

</div>
<!-- Action Button -->

<button class="w-full bg-primary text-on-primary text-headline-md font-headline-md py-4 rounded-xl shadow-[0px_4px_20px_rgba(59,106,27,0.3)] hover:scale-[0.98] active:scale-95 transition-transform duration-150 flex items-center justify-center">
                        Continue
                    </button>
</div>
</div>
</main>
<!-- Ambient Background Elements to match the aesthetic -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<!-- Subtle gradient to mimic the warm sky -->
<div class="absolute top-0 w-full h-1/3 bg-gradient-to-b from-[#FFF5E1] to-transparent opacity-50"></div>
<!-- Decorative sun/cloud blob (CSS representation) -->
<div class="absolute top-10 right-10 w-24 h-24 bg-[#FFE8C2] rounded-full blur-2xl opacity-60"></div>
</div>
