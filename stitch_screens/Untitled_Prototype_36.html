<style>
        /* Custom styles to ensure background image acts as an immersive layer */
        .splash-bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: bottom center;
            background-repeat: no-repeat;
            opacity: 0.9;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-bright text-on-background font-body-md min-h-screen overflow-hidden flex flex-col items-center justify-between relative">
<!-- Background Illustration Layer -->
<!-- The main illustration acts as an immersive background extending from the bottom -->
<div class="splash-bg-layer" data-alt="A beautiful, warm, and highly tactile storybook illustration designed for an early childhood education app. The scene features a young boy and girl sitting together in a soft, rolling grassy meadow under a gentle, warm sky with fluffy clouds. They are joyfully sharing and reading a large, open physical book. The visual style uses organic shapes, soft edges, and a comforting color palette of primary greens, deep earthy browns, and warm cream tones, evoking a high-quality, handcrafted physical storybook. The mood is nurturing, curious, and safe." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCP8t0_mdh4b8NqDU-rQwFBkYGLrzp5qBGru3d7bHEm-Y7kTJeZEHJIpSEArOLYraPa5G69r8Aazvp1lx-WjmadMHGuGBr8p2zagZ4K6Wd3tU0YoH07xoCMGIPltuJYt1tsqydr_T18Hzx9PHntOQ5ClSQ7HAGbSdeYYeaTgqKVNz2FoV-B5AT6N56Rrs7T1PIjIwBFMYwUWxgpZ1rz8OIn0DFjabn_SxE1NVz7wrJ5Nlx0JgNFyYJn0ajVyu1ahjVloN5KYH-BPIM')">
</div>
<!-- Content Overlay Layer -->
<main class="relative z-10 w-full max-w-md mx-auto flex-1 flex flex-col justify-start items-center pt-[132px] px-container-padding pb-xl">
<!-- Typography Anchor -->
<div class="flex flex-col items-center justify-center text-center gap-xs">
<h1 class="text-display-lg font-display-lg text-on-tertiary-container drop-shadow-sm tracking-tight">
                EduCloud
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-[250px] leading-relaxed">
                Learn. Grow. Shine.
            </p>
</div>
<!-- Optional: A subtle loading indicator or interaction cue could go near the bottom if needed, 
             but splash screens are typically passive. Let's keep it focused on the brand. -->
</main>
<!-- Decorative Top Element (Simulating the clouds in the original design if the bg image doesn't cover it fully) -->
<div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-surface-bright/80 to-transparent z-0 pointer-events-none"></div>
