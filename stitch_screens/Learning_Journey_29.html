<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-container-padding py-md w-full bg-background docked full-width top-0 z-10 sticky">
<div class="flex items-center gap-sm cursor-pointer hover:bg-surface-container-low transition-colors rounded-full p-2 -ml-2">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="chevron_left">chevron_left</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-background flex-1 text-center pr-[44px]">Your learning journey</h1>
</header>
<!-- Main Content Canvas - The Map -->
<main class="flex-1 relative overflow-hidden bg-[#E6F3E6]">
<!-- Background Illustration Wrapper -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-bottom w-full h-full opacity-90" data-alt="A lush, warm, illustrative landscape for an early childhood education app. Rolling green hills with soft, tactile textures resembling a high-quality physical storybook. A winding river flows through the scene. In the distance, cozy huts and gentle, organic trees. The colors are warm, inviting, and natural, evoking comfort and curiosity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBu2OQby_43BZHJxPL1EOvcv_F4fH5_f0BpTveb3EeONFcr8Xa79afJS71H-Ok9TIwCURcpJMq9tYd4YfvbXQk5K8sv0sN3CiJHKuzSEolLuEVz5VZkk0Q-xp1kzZ5OWtBW9N31Fb2rVcAHDJnX5lo3HBjwysVEWpkglLRXyiYpZAfattUsNgn2ZkiiYYRveCxKV_X_Y6uvIrndLWQeCYs08N6zNWmsS24VrHUHnxX5wStwYAIYFZuLix8lc7LiugjP8kI_F1GwKCM')"></div>
</div>
<!-- Scrollable Map Area -->
<div class="relative z-10 w-full h-full overflow-y-auto pb-[140px] px-container-padding" id="map-container">
<!-- SVG Path connecting nodes -->
<svg class="absolute inset-0 w-full h-[800px] pointer-events-none" style="z-index: -1;">
<path d="M 100,50 C 150,150 250,100 300,200 C 350,300 200,350 200,450 C 200,550 150,600 150,700" fill="none" stroke="#e3e2e0" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
<path class="animate-[dash_2s_ease-out_forwards]" d="M 100,50 C 150,150 250,100 300,200 C 350,300 200,350 200,450" fill="none" stroke="#6da04b" stroke-dasharray="1000" stroke-dashoffset="1000" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
<style>
                    @keyframes dash {
                      to {
                        stroke-dashoffset: 0;
                      }
                    }
                </style>
</svg>
<!-- Map Nodes -->
<div class="relative w-full h-[800px]">
<!-- Node 1: Completed -->
<div class="absolute left-[80px] top-[40px] flex items-center group cursor-pointer">
<div class="bg-surface-container-lowest rounded-full py-2 px-4 shadow-[0px_4px_20px_rgba(59,106,27,0.15)] flex items-center gap-xs border border-surface-container-low transition-transform duration-150 active:scale-95">
<span class="text-label-lg font-label-lg text-on-surface">Sharing equally</span>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-on-primary text-[16px] filled" data-icon="check">check</span>
</div>
</div>
</div>
<!-- Node 2: Completed -->
<div class="absolute left-[180px] top-[140px] flex items-center group cursor-pointer">
<div class="bg-surface-container-lowest rounded-full py-2 px-4 shadow-[0px_4px_20px_rgba(59,106,27,0.15)] flex items-center gap-xs border border-surface-container-low transition-transform duration-150 active:scale-95">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-on-primary text-[16px] filled" data-icon="check">check</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface">Add within 100</span>
</div>
</div>
<!-- Node 3: Current / Active Focus -->
<div class="absolute left-[120px] top-[260px] flex items-center flex-col gap-2 z-20">

<div class="w-10 h-10 bg-secondary-container rounded-full shadow-[0px_4px_16px_rgba(254,155,78,0.4)] flex items-center justify-center border-2 border-surface-container-lowest">

</div>
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-0 h-0 border-l-4 border-r-4 border-t-6 border-transparent border-t-secondary-container"></div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-lg border border-surface-container-low w-[180px] text-center">
<div class="w-full bg-surface-container-highest rounded-full h-2 mb-2 overflow-hidden">
<div class="bg-primary h-full w-[60%] rounded-full"></div>
</div>
<span class="text-label-lg font-label-lg text-on-surface block leading-tight">Groups &amp; multiplication</span>
</div>
</div>
<!-- Node 4: Locked -->
<div class="absolute left-[200px] top-[420px] flex items-center group opacity-80">
<div class="bg-surface-container-low rounded-full py-2 px-4 shadow-sm flex items-center gap-xs border border-surface-container-high">
<div class="w-6 h-6 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]" data-icon="lock">lock</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface-variant">Fractions</span>
</div>
</div>
<!-- Node 5: Locked -->
<div class="absolute left-[130px] top-[540px] flex items-center group opacity-80">
<div class="bg-surface-container-low rounded-full py-2 px-4 shadow-sm flex items-center gap-xs border border-surface-container-high">
<div class="w-6 h-6 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]" data-icon="lock">lock</span>
</div>
<span class="text-label-lg font-label-lg text-on-surface-variant">Geometry</span>
</div>
</div>
</div>
</div>
<!-- Sticky Action Card for Current Lesson -->
<div class="absolute bottom-0 left-0 w-full px-container-padding pb-[80px] pt-4 bg-gradient-to-t from-background via-background to-transparent z-20 pointer-events-none">
<div class="bg-surface-container-lowest rounded-[24px] p-md shadow-[0px_-4px_24px_rgba(0,0,0,0.08)] border border-surface-container-low flex justify-between items-center pointer-events-auto transition-transform duration-200 hover:-translate-y-1">

<h3 class="text-headline-md font-headline-md text-on-surface mb-1">Groups &amp; multiplication</h3>
<p class="text-body-md font-body-md text-on-surface-variant flex items-center gap-1">
                        You are here
                    </p>
<div class="w-24 bg-surface-container-highest rounded-full h-1.5 mt-2 overflow-hidden">
<div class="bg-primary h-full w-[60%] rounded-full"></div>
</div>
</div>
<button class="bg-secondary-container hover:bg-secondary-fixed text-on-secondary-container font-label-lg text-label-lg px-6 py-3 rounded-xl shadow-[0px_4px_12px_rgba(254,155,78,0.2)] transition-all duration-150 active:scale-95 active:shadow-sm">
                    Continue
                </button>
<button aria-label="Close" class="absolute -top-3 -right-3 bg-surface-container-lowest rounded-full p-1 shadow-md border border-surface-container-low text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Hidden on md+ screens per blueprint) -->
<nav class="md:hidden bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] docked full-width bottom-0 rounded-t-xl fixed left-0 w-full z-50 flex justify-around items-center px-4 py-2 border-t-0">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
<span class="text-[12px] font-label-lg">Today</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary bg-secondary-fixed rounded-full px-4 py-1 scale-90 transition-all duration-200 ease-out" href="#">
<span class="material-symbols-outlined filled mb-1 text-[24px]" data-icon="menu_book">menu_book</span>
<span class="text-[12px] font-label-lg font-bold">Learn</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="leaderboard">leaderboard</span>
<span class="text-[12px] font-label-lg">Progress</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
<span class="text-[12px] font-label-lg">Profile</span>
</a>
</nav>
<script>
        // Simple script to center the map on the active node on load
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('map-container');
            // Approximate scroll to show the middle section where active node is
            container.scrollTop = 150;
        });
    </script>
</body></html>
