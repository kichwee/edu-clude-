<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden">
<!-- Transactional Top Navigation (Suppressed standard shell, custom layout) -->
<header class="w-full px-container-padding py-md flex justify-between items-center z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container transition-colors shadow-[0px_4px_20px_rgba(0,0,0,0.03)] text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back_ios_new">arrow_back_ios_new</span>
</button>
<!-- Progress Indicator -->
<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-4 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container transition-colors shadow-[0px_4px_20px_rgba(0,0,0,0.03)] text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="keyboard_arrow_up">keyboard_arrow_up</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding pb-[100px] gap-lg">
<!-- Headers -->
<div class="text-center w-full max-w-md flex flex-col gap-sm">
<h1 class="text-display-lg font-display-lg text-on-background flex items-center justify-center gap-sm">
                Great job! <span class="text-4xl">🎉</span>
</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">
                You shared them equally.
            </p>
</div>
<!-- Hero Illustration -->
<div class="w-full max-w-md relative flex justify-center py-xl">
<img class="w-full h-auto max-h-[300px] object-contain drop-shadow-[0px_10px_30px_rgba(109,160,75,0.15)] z-10" data-alt="A warm, high-quality 3D illustration in a tactile storybook style. Two happy young children of diverse descent are smiling brightly next to two woven wooden baskets. Each basket is filled with exactly the same amount of ripe, yellow mangoes. The background is a soft, creamy neutral surface with subtle ambient lighting. The style features soft edges, organic shapes, and a comforting, safe atmosphere typical of premium early childhood education materials." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5Ih8eRVZ890a3rbKNZF2d08HgX8WSKxvkpu_kck5yjCmzd3V-F9SGTtCQzLu_nItgr3VA03lxYcm6dld9RbmH-6y5Pu-7ufJMfrFuFGRqhUFFHfTaSOvG2OnjTUt-EJ3UppI_Tv9ASAjet4VInNm2YIyQziQSPru9Vp0rban_AUTGwRolnS6gVYAcZdwZQu5f78hH8gRSXlq0hBCLTP_I4NMc-Rdg8d-RQrP7DYdcn68k7joEs02zw-xkQG2rDz-2SctiAWWZpjY"/>
<!-- Ambient glowing backdrop for the illustration -->
<div class="absolute inset-0 bg-primary-container opacity-5 rounded-full blur-3xl transform scale-75 z-0"></div>
</div>
<!-- Educational 'Remember' Card -->
<div class="w-full max-w-sm bg-surface-container-low rounded-3xl p-md flex flex-row items-center gap-md shadow-[0px_4px_20px_rgba(0,0,0,0.04)] relative overflow-hidden">
<!-- Decorative organic blob shape in background of card -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-secondary-fixed opacity-30 rounded-full blur-xl"></div>
<div class="w-16 h-16 shrink-0 rounded-full bg-surface-container-highest border-4 border-surface overflow-hidden shadow-sm z-10">
<img class="w-full h-full object-cover" data-alt="A small, circular 3D illustrative portrait of a smiling young boy with curly dark hair, wearing a simple green shirt. The style is warm, tactile, and highly reminiscent of a premium physical storybook character. The lighting is soft and inviting, emphasizing organic features and a friendly, encouraging expression. The background of the portrait is a clean, neutral cream color to fit seamlessly within a user interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6ZmxAZoKEEPx3XNjGMkqgkfjgpPTV5_BUQTz1Od7LnJcvn5wUndTZ5ZBJgsO4MG_S0MRAACt7b6Wz4T9cDbplP959FFhkMQwfF_NcEKTMJYZTDWtYuZ8LSkOZfyoPc7wosvEVGeC_jMbuFITZAXL3ItG4HXDekHTwXQKUethFBrSvnJ3sGnF2lsrh_IJJxO2RJE8kTQVOrgp_zspI3AvLVfGNu_54SBqK2RIwAg_4xAiJKQ1EddYZ5h1szwV5IA-LViswBFOA934"/>
</div>

<p class="text-body-md font-body-md text-on-background leading-tight">

                </p>

                Continue
            </button>
</div>
</div>
