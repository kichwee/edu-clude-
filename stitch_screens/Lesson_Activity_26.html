<!-- Basic Drag and Drop Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const draggables = document.querySelectorAll('.draggable-item');
            const dropTargets = document.querySelectorAll('.droptarget, #mango-pool');

            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', () => {
                    draggable.classList.add('dragging', 'opacity-50', 'scale-110');
                });

                draggable.addEventListener('dragend', () => {
                    draggable.classList.remove('dragging', 'opacity-50', 'scale-110');
                });
            });

            dropTargets.forEach(target => {
                target.addEventListener('dragover', e => {
                    e.preventDefault();
                    target.classList.add('scale-105', 'transition-transform');
                });

                target.addEventListener('dragleave', () => {
                     target.classList.remove('scale-105');
                });

                target.addEventListener('drop', e => {
                    e.preventDefault();
                    target.classList.remove('scale-105');
                    const draggable = document.querySelector('.dragging');
                    if (draggable) {
                        // Very basic visual movement logic for demo purposes
                        if (target.id.startsWith('basket')) {
                            const contentArea = document.getElementById(`${target.id}-content`);
                            draggable.classList.add('absolute');
                            draggable.style.width = '40px';
                            draggable.style.height = '40px';
                            contentArea.appendChild(draggable);
                        } else if (target.id === 'mango-pool') {
                            draggable.classList.remove('absolute');
                            draggable.style.width = '';
                            draggable.style.height = '';
                            target.appendChild(draggable);
                        }
                    }
                });
            });
        });
    </script>
