name: Verify demo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edu-cloud/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mvp.txt
      - run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-not-a-production-secret
      - run: python manage.py test educloud.tests -v 1
        env:
          DJANGO_SECRET_KEY: ci-not-a-production-secret

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ../edu-cloud/backend/.venv/bin/python ../tools/generate_grade3_rule_tutor.py || python3 ../tools/generate_grade3_rule_tutor.py
      - run: git diff --exit-code -- app/src/main/java/com/example/educloud/content/GeneratedGrade3RuleTutor.kt
      - run: ./gradlew testDebugUnitTest --no-daemon --console=plain
